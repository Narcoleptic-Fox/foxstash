name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Compile EVERY target, not just the library crates.
      #
      # `cargo test -p foxstash-core` passes while the workspace does not build: examples and
      # benches are never compiled by the per-crate steps below. Deleting the public
      # `BinaryHNSWIndex` left `crates/benches/examples/quantizer_sift.rs` referencing a type
      # that no longer exists, with a fully green test run. This step is the only thing in CI
      # that would have caught it.
      - name: Check every target compiles (examples and benches included)
        run: cargo check --workspace --all-targets --verbose

      - name: Build foxstash-core
        run: cargo build -p foxstash-core --verbose

      - name: Run foxstash-core unit tests
        run: cargo test -p foxstash-core --lib --verbose

      - name: Run foxstash-core integration tests
        run: cargo test -p foxstash-core --tests --verbose

      - name: Run foxstash-core doctests
        run: cargo test -p foxstash-core --doc --verbose

      - name: Run foxstash-core tests with compression features
        run: cargo test -p foxstash-core --features compression-all --verbose

      - name: Build foxstash-db
        run: cargo build -p foxstash-db --verbose

      - name: Run foxstash-db tests
        run: cargo test -p foxstash-db --verbose

      # foxstash-native depends on foxstash-core with the "onnx" feature, which
      # uses ort with load-dynamic. This means compilation succeeds without the
      # ONNX Runtime shared library present — the library is only loaded at
      # runtime when OnnxEmbedder is actually initialized. The native crate's
      # own tests exercise FFI (FlatIndex/HNSWIndex) and do not invoke the ONNX
      # embedder, so they run without ORT_DYLIB_PATH being set.
      - name: Build foxstash-native
        run: cargo build -p foxstash-native --verbose

      - name: Run foxstash-native tests
        run: cargo test -p foxstash-native --verbose

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy foxstash-core
        run: cargo clippy -p foxstash-core --all-targets -- -D warnings

      - name: Clippy foxstash-db
        run: cargo clippy -p foxstash-db --all-targets -- -D warnings

      - name: Clippy foxstash-native
        run: cargo clippy -p foxstash-native --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check foxstash-core formatting
        run: cargo fmt -p foxstash-core -- --check

      - name: Check foxstash-db formatting
        run: cargo fmt -p foxstash-db -- --check

      - name: Check foxstash-native formatting
        run: cargo fmt -p foxstash-native -- --check

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        run: wasm-pack build crates/wasm --target web

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Run coverage for foxstash-core including unit tests, integration tests
      # (crates/core/tests/integration_tests.rs), and doctests. The previous
      # --lib flag excluded integration tests; omitting it captures all targets.
      - name: Generate coverage for foxstash-core
        run: cargo llvm-cov -p foxstash-core --lcov --output-path lcov-core.info

      - name: Generate coverage for foxstash-db
        run: cargo llvm-cov -p foxstash-db --lcov --output-path lcov-db.info

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov-core.info,lcov-db.info
          fail_ci_if_error: false

  config-matrix:
    name: Every config option reaches every path that claims it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails if a public HNSWConfig field is read by no entry point (a public option nothing
      # honours -- the shape of four bugs in the 1.0 audit), or if the matrix embedded in
      # docs/ARCHITECTURE.md has drifted from the source. A generated diagram that is allowed to
      # go stale is worse than no diagram: it rots while looking authoritative.
      - run: python3 xtask/config_matrix.py

  python:
    name: Python binding (recall vs brute force)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin numpy pytest
      - run: python -m venv .venv && .venv/bin/pip install numpy pytest
      # Scores every query against brute-force ground truth computed in numpy from the same X.
      # A binding that mis-mapped row indices would still return k plausible integers per query
      # and would look perfectly healthy; brute-force scoring is what tells them apart.
      - name: Build and test the binding
        run: |
          cd crates/python
          VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv maturin develop --release
          cd "$GITHUB_WORKSPACE"
          .venv/bin/python -m pytest crates/python/tests -q
