name: Bug Report
description: Report a bug or unexpected behavior in foxstash
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill out the fields
        below so we can reproduce and fix it as quickly as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Create an index with ...
        2. Insert vectors ...
        3. Call search() with ...
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected outcome...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include any error messages or stack traces.
      placeholder: Describe what actually happened, paste errors here...
      render: text
    validations:
      required: true

  - type: input
    id: foxstash-version
    attributes:
      label: foxstash Version
      description: Which version of foxstash-core or foxstash-db are you using?
      placeholder: "e.g. 0.4.0"
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      description: Output of `rustc --version`
      placeholder: "e.g. rustc 1.77.0 (aedd173a2 2024-03-17)"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      description: OS and version where the bug occurs
      placeholder: "e.g. Ubuntu 22.04, Windows 11, macOS 14"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: >
        Any other context that might help — minimal reproducer code, related
        issues, screenshots, etc.
    validations:
      required: false
