[workspace]
members = [
    "crates/core",
    "crates/db",
    "crates/wasm",
    "crates/native",
    "crates/python",
    "crates/benches",
    "crates/gpu",
]
# `foxstash-gpu` is an OPTIONAL GPU backend (pulls cubecl/wgpu — heavy) that nothing else depends on.
# It stays a member so `cargo <cmd> -p foxstash-gpu` works, but is excluded from `default-members` so a
# bare `cargo build` / `cargo test` (and thus the common dev loop) skips it. CI's `--workspace` steps
# pass `--exclude foxstash-gpu` for the same reason — see `.github/workflows/ci.yml`.
default-members = [
    "crates/core",
    "crates/db",
    "crates/wasm",
    "crates/native",
    "crates/python",
    "crates/benches",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.95"
authors = ["Narcoleptic Fox <dev@narcolepticfox.com>"]
license = "MIT"

[workspace.dependencies]
# Core dependencies
ndarray = "0.17"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# ONNX Runtime
# Use load-dynamic to avoid MSVC CRT conflicts (LNK2005) on Windows.
# The static ONNX Runtime library links /MT (static CRT) while Rust's
# default MSVC target uses /MD (dynamic CRT), causing duplicate symbol
# errors. load-dynamic sidesteps this by loading onnxruntime at runtime
# via dlopen/LoadLibrary instead of linking at compile time.
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
tokenizers = "0.23"

# Caching
lru = "0.18"

# WASM dependencies
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"

# Testing
criterion = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Mutation testing (`cargo mutants --profile mutants`).
#
# A mutation run rebuilds and re-tests the crate once per mutant — order 10^3 times — so the
# cost that matters is `build + test` per iteration, not the speed of either alone.
#
# `release` is the wrong profile for that: `lto = true` with `codegen-units = 1` makes the whole
# crate a single codegen unit, which is what you want for a benchmark and exactly what you do not
# want when the same crate is recompiled a thousand times. Measured on this workspace, dropping
# both takes a `foxstash-core` rebuild from 24.1 s to 14.1 s.
#
# `opt-level` turned out NOT to be a lever, which is worth recording so nobody re-tunes it hoping
# otherwise. Measured `build + test` per iteration: opt 1 ≈ 18.3 s, opt 2 ≈ 17.2 s, opt 3 ≈ 17.4 s
# — a ~1 s spread, i.e. noise. The expectation was that lowering it would trade build time for
# test time (these tests build HNSW graphs and run recall sweeps, so they are compute-bound); in
# practice neither side moved much and linking dominates. 2 is kept as the unremarkable middle,
# not as a tuned value.
#
# `debug-assertions` stays ON. A mutant that trips an overflow check or a debug invariant is a
# mutant the suite caught, and catching it in a cheap assertion beats catching it in a slow test.
[profile.mutants]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
debug-assertions = true
strip = false

[profile.release-wasm]
inherits = "release"
opt-level = "z"     # Optimize for size
lto = true
codegen-units = 1
