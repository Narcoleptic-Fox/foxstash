[package]
name = "foxstash-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Foxstash WASM bindings for browser-based vector search"
repository = "https://github.com/Narcoleptic-Fox/foxstash"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
foxstash-core = { path = "../core" }
foxstash-db = { path = "../db" }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "console",
    "Window",
    "Performance",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbRequest",
    "IdbOpenDbRequest",
    "IdbVersionChangeEvent",
    "IdbTransactionMode",
    "IdbCursorWithValue",
    "DomException",
    "DomStringList",
] }
console_error_panic_hook.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"

# Pin getrandom to 0.2 with `js` feature: this version's `rand_core 0.6` (via
# `rand 0.8` in foxstash-core) requires `getrandom 0.2` and uses the legacy
# `js` feature name. Upgrading getrandom requires upgrading `rand` to 0.10+ in
# the same change, since the feature was renamed to `wasm_js` in getrandom 0.3+.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Disable wasm-opt to avoid bulk-memory validation errors
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
