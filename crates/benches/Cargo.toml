[package]
name = "foxstash-benches"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
foxstash-core = { path = "../core" }
bincode.workspace = true
criterion.workspace = true
rand.workspace = true
serde_json.workspace = true
tempfile = "3.8"

# Comparison benchmarks
instant-distance = "0.6"

[features]
default = []
ci = []  # Reduces dataset sizes for CI runners (caps at 1K docs instead of 10K)
onnx = ["foxstash-core/onnx"]
compression-all = ["foxstash-core/compression-all"]
all = ["onnx", "compression-all"]

[[bench]]
name = "embedding"
harness = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "full"
harness = false

[[bench]]
name = "comparison"
harness = false
