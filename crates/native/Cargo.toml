[package]
name = "foxstash-native"
version.workspace = true
edition.workspace = true
description = "Foxstash native bindings for desktop/server use"
repository = "https://github.com/Narcoleptic-Fox/foxstash"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
foxstash-core = { path = "../core", features = ["onnx"] }

[dev-dependencies]
tempfile = "3.8"
