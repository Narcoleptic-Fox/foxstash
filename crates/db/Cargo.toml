[package]
name = "foxstash-db"
version.workspace = true
edition.workspace = true
description = "Database layer for foxstash — collections, filtering, hybrid search, WAL persistence, and concurrent access"
repository = "https://github.com/Narcoleptic-Fox/foxstash"
license = "MIT"
readme = "../../README.md"
keywords = ["rag", "vector-search", "hybrid-search", "bm25", "database"]
categories = ["algorithms", "data-structures", "database-implementations"]

[dependencies]
foxstash-core = { path = "../core", version = "0.4.1" }
serde.workspace = true
serde_json.workspace = true

# Desktop-only dependencies (filesystem, concurrency, error handling)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
thiserror = "1.0"
parking_lot = "0.12"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.8"
